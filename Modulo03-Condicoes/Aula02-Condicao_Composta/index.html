<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Onde voce Nasceu?</h1>
    <input type="text" name="paistxt" id="paistxt">
    <input type="button" value="Enviar" onclick="clicar()">
    <div id="res"></div>

    <script>
        function clicar() {
            var paistxt = window.document.getElementById('paistxt')
            var res = window.document.getElementById('res')

            var pais = paistxt.value

            if (pais.toLowerCase() == 'brasil') {
                res.innerHTML = 'Voce é <strong>Brasileiro</strong>'
            } else {
                res.innerHTML = 'Voce é <strong>Estrangeiro</strong>'
            }
        }
    </script>
</body>
</html>
